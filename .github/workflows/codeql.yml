# Static analysis, on the schedule a one-person project can actually sustain.
#
# On every push to main and every PR, plus weekly so a newly published rule
# finds old code. It is also one of the signals OpenSSF Scorecard and the
# directory listings read, which is a side benefit rather than the reason.
name: codeql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: '17 4 * * 1'
# Read at the top; the one write this needs is granted to the job that needs it.
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
