# Publish ratchet-mcp to npm, with provenance.
#
# Triggered by publishing a GitHub release, so the tag, the release notes and
# the package version are one event rather than three manual steps that can
# disagree. --provenance signs the package with a verifiable statement of which
# workflow, at which commit, produced it: npm shows the badge, and OpenSSF
# Scorecard reads it for both Packaging and Signed-Releases.
#
# Needs an NPM_TOKEN secret (an automation token, not a publish-with-2FA one) or
# the job is skipped rather than failed — a missing credential is a setup step,
# not a broken build.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to attach the SBOM to the release
      id-token: write        # what lets npm attach provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The bin is a single dependency-free file, so there is nothing to build
      # and nothing to install. It is still checked before it is published.
      - name: The server must speak MCP before it is published
        working-directory: packages/ratchet-mcp
        run: |
          node --check bin/ratchet-mcp.mjs
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | node bin/ratchet-mcp.mjs 2>/dev/null \
            | grep -q '"result"' || { echo "initialize did not return a result"; exit 1; }

      # Provenance answers "which workflow, at which commit". It does not answer
      # "was that commit the one the maintainer released" — a release can be cut
      # from any tag, including an unsigned or a lightweight one, and the
      # attestation would still be perfectly genuine about a commit nobody
      # vouched for. Tags are signed now, so require the signature to verify
      # before anything reaches npm.
      - name: The tag being published must carry a verified signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-v$(node -p "require('./packages/ratchet-mcp/package.json').version")}"
          echo "checking $TAG"

          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
                  --jq '.object.type + " " + .object.sha')
          type="${ref% *}"; sha="${ref#* }"

          # Only an annotated tag object can carry a signature at all.
          if [ "$type" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag, so it carries no signature."
            echo "  Re-create it signed:  git tag -s ${TAG} <commit> -m '...' && git push --force origin ${TAG}"
            exit 1
          fi

          v=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.verified')
          r=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.verification.reason')
          if [ "$v" != "true" ]; then
            echo "::error::${TAG} signature did not verify (${r})."
            echo "  A signing key must be registered at https://github.com/settings/keys"
            exit 1
          fi
          echo "${TAG}: signature verified (${r})"

      # An SBOM per release, in both formats procurement actually asks for.
      # The dependency set is small and pinned by a committed lockfile, but a
      # lockfile is not an SBOM: it says what we resolved, not what shipped, and
      # it is not in a format anybody else's tooling reads.
      #
      # Generated after the signature check above, so the bill of materials
      # describes a commit whose tag verified.
      - name: Software bill of materials
        run: |
          set -euo pipefail
          mkdir -p sbom
          npm sbom --sbom-format spdx      --omit dev > sbom/ratchet.spdx.json
          npm sbom --sbom-format cyclonedx --omit dev > sbom/ratchet.cyclonedx.json
          for f in sbom/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error::$f is not valid JSON"; exit 1; }
            echo "  $f  $(wc -c < "$f") bytes"
          done

      - name: Attach the SBOM to the release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom/*.json --clobber

      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: packages/ratchet-mcp
        run: npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Say why nothing was published
        if: ${{ env.NPM_TOKEN == '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "NPM_TOKEN is not set, so nothing was published."
          echo "Add an automation token: gh secret set NPM_TOKEN"
