# OpenSSF Scorecard.
#
# Publishes an automated supply-chain score and, with publish_results, a badge
# that reflects what the repository actually does rather than what it claims:
# branch protection, code review, pinned actions, SAST, a dependency updater, a
# security policy, signed releases. Most of those already exist here; this is the
# thing that reads them.
#
# Weekly rather than per-push. The score moves on repository *settings* and
# release practice, not on a commit, so running it on every push would be noise
# and would spend Actions minutes to tell you the same number.
name: scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 1'
  push:
    branches: [main]
permissions: read-all

jobs:
  analysis:
    name: analyse
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF so findings show in the Security tab
      id-token: write          # publish the result so the badge can resolve
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }

      # v2.4.4, not v2.4.0. The older tag pulls its container from
      # gcr.io/openssf/scorecard-action, and that Google Cloud project has
      # billing disabled — every run fails with "This API method requires
      # billing to be enabled" before it looks at a single file. Their
      # infrastructure, not ours; v2.4.4 pulls from ghcr.io instead.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          sarif_file: results.sarif
