# The suite, on every push.
#
# There was no CI. The only thing between a broken change and production was
# whoever remembered to run `npm test`, and on 1 September that failed exactly
# as you would expect: five failing tests were deployed because the deploy was
# chained into the same command as the test run.
#
# This runs what a developer runs — scripts/test.sh, not a reimplementation of
# it — so CI passing and "it works on my machine" cannot mean different things.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # The suite depends on FOR UPDATE, SKIP LOCKED, partial indexes and
        # advisory locks, so this has to be real Postgres rather than a stub.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ratchet
          POSTGRES_PASSWORD: ratchet
          POSTGRES_DB: postgres
        # 5433 on the host, because that is the port the scripts and the
        # developer default already use.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ratchet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Full suite
        run: npm test

      - name: Fuzz the security-critical parsers
        # Property-based, over the three functions that read attacker-supplied
        # input before anything has been verified: the payload fingerprint that
        # decides what counts as a duplicate, the SSRF guard, and payment
        # webhook signature verification. More cases here than locally — CI has
        # the time, and the whole point is to reach inputs nobody thought of.
        env:
          FUZZ_RUNS: 50000
        run: npm run fuzz

      - name: Reproducible build
        # Two clean builds must be byte-identical and carry nothing specific to
        # the machine that made them. Same-machine determinism is the easy half;
        # the check that matters is that no absolute path leaked into a source
        # map, because that is how a build stops reproducing for anybody else.
        run: npm run verify:build

      - name: Every file says who owns it and under what licence
        # REUSE 3.3. The per-file headers were added by hand once; without a
        # check the next file added simply would not have one, and the badge
        # would be describing a past state of the repository.
        run: pipx run 'reuse[charset-normalizer]' lint

      - name: Dependency licences are within policy
        run: bash scripts/check-licenses.sh

      - name: Production dependency audit
        # A vulnerable production dependency should fail the build; a vulnerable
        # dev tool should not stop a release at midnight.
        run: npm run audit
