# Scheduled backup with a proven restore.
#
# Runs the same pipeline as `npm run backup:verify`: dump production, restore it
# into a matching Postgres, re-verify every receipt against the published public
# key, and only then ship the dump off-machine.
#
# SECURITY NOTE — this repository is PUBLIC.
#
# The workflow deliberately does NOT trigger on `pull_request`. A fork's PR can
# propose arbitrary workflow changes, and any trigger that both runs fork code
# and exposes repository secrets hands those secrets to anyone who opens a PR.
# Schedule and manual dispatch only, both of which run trusted code from the
# default branch.
#
# For the same reason it refuses to run outside the default branch: dispatch can
# target any ref, and branch code must not reach these secrets.
#
# It also never echoes a secret, and the dump is retained as an artifact for a
# short window only — it contains every workspace, key hash, and receipt in
# production.
name: backup

on:
  schedule:
    # 04:00 UTC daily. Deliberately not midnight: everybody schedules midnight,
    # and a queue is a bad place to be when you need the backup to have run.
    - cron: '0 4 * * *'
  workflow_dispatch:

# One at a time. Two concurrent dumps would race for the same machine and the
# same bucket key prefix.
concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Default branch only.
      #
      # This job dumps the entire production database and holds the credentials
      # to do it. workflow_dispatch can target any ref, which means a branch
      # that edits scripts/backup-verify.sh could run its own code against those
      # secrets — the same objection this file already makes to the
      # pull_request trigger, differing only in that it needs write access
      # rather than none.
      #
      # The cost is real: the backup cannot be exercised on a branch before
      # merging. That is the right trade for a job with unrestricted read of
      # every workspace, key hash and receipt in production.
      - name: Refuse to run outside the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "This workflow only runs on ${{ github.event.repository.default_branch }}."
          echo "It dumps production and holds the credentials to do so, and"
          echo "workflow_dispatch can target any ref — so branch code must not"
          echo "reach these secrets."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # The restore is verified by scripts/verify-restore.mjs, which connects to
      # the throwaway Postgres with the `pg` driver. Without this the run gets
      # all the way through dumping and restoring before dying on a missing
      # module — the most expensive possible place to discover it.
      # Production deps only: nothing here needs the test toolchain.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Dump, restore, verify, upload
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          TIGRIS_BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          TIGRIS_ENDPOINT: https://fly.storage.tigris.dev
          BASE: https://ratchetgate.com
        run: |
          set -euo pipefail
          npm run backup:verify

      # The database backups are worthless without the code that understands
      # the schema, and until now the code had exactly one copy that was not a
      # laptop: GitHub. One account, one vendor. This puts a complete,
      # verified history beside the data, in a different company.
      - name: Snapshot the repository beside the data
        env:
          TIGRIS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
          TIGRIS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
          TIGRIS_BUCKET: ${{ secrets.TIGRIS_BUCKET }}
          TIGRIS_ENDPOINT: https://fly.storage.tigris.dev
        run: |
          set -euo pipefail
          git fetch --unshallow 2>/dev/null || true
          npm run snapshot:code

      # Only reached when the restore verified and the upload succeeded, so a
      # green run means a backup that has been proven restorable — not merely
      # a file that was produced.
      - name: Summary
        if: success()
        run: echo "Backup dumped, restored, cryptographically verified, and uploaded." >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure loudly
        if: failure()
        run: |
          {
            echo "## Backup FAILED"
            echo
            echo "The nightly backup did not complete. Until this is fixed there is no"
            echo "fresh off-machine copy, and the most recent verified backup is whatever"
            echo "the last green run produced."
          } >> "$GITHUB_STEP_SUMMARY"
